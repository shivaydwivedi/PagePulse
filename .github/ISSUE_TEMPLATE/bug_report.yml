name: Bug report
description: Report a reproducible PagePulse bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Run ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js version, npm version, OS, branch, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs with secrets removed
      description: Paste only the relevant log lines and remove tokens, credentials, cookies, private URLs, and client data.
      render: text
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data confirmation
      options:
        - label: I removed secrets, credentials, tokens, cookies, private URLs, and unnecessary personal data.
          required: true
